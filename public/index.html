<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AirLva</title>
<meta name="theme-color" content="#ffffff">
<script>try{var t=localStorage.getItem("airlva_theme")||"light",r=document.documentElement;r.dataset.theme=t;if(t!=="light"){r.dataset.dark="1";document.querySelector("meta[name=theme-color]").content=t==="baru"?"#06070b":"#13151b"}}catch(e){}</script>
<link rel="stylesheet" href="css/style.css?v=20261119a">
</head>
<body>
<div id="splash"><div class="lg"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c3-1 4-5 8-5s4 4 10 3M5 19c2-.5 3-3 6-3s3 2 8 2"/></svg></div><h2>AirLva</h2></div>
<div id="app">
  <div class="blobs"><i></i><i></i><i></i></div>
  <div class="rgb" id="rgb"><i class="glow"></i><i class="strip"></i></div>
  <header>
    <button class="ib" id="menu" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="brand"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c3-1 4-5 8-5s4 4 10 3M5 19c2-.5 3-3 6-3s3 2 8 2"/></svg></div><span id="ptitle">AirLva</span></div>
    <button class="cr" id="cr" aria-label="Kredit"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg><span id="crn">0</span></button>
  </header>
  <main id="main"></main>
  <div class="box" id="box" style="display:none">
    <div class="vbar" id="vbar" hidden></div>
    <div class="rbar" id="rbar" hidden></div>
    <div class="recp" id="rec" hidden></div>
    <div class="recp" id="ipv" hidden></div>
    <textarea id="inp" rows="1" placeholder="Balas AirLva"></textarea>
    <div class="row">
      <button class="cb g" id="plus" aria-label="Tambah"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="pill" id="model">Pilih model<span>›</span></button>
      <div class="sp"></div>
      <button class="cb g" id="mic" aria-label="Mikrofon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="cb b" id="act" aria-label="Kirim"></button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="ov" id="ov"></div>
  <div class="sheet" id="sheet"><div class="grab"></div><h3>Model AirLva</h3><p>Dipilih otomatis sesuai mode.</p><div class="mlist" id="mlist"></div><button class="btn" id="closeSheet">Tutup</button></div>
  <aside class="drawer" id="drawer">
    <div class="brand"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c3-1 4-5 8-5s4 4 10 3M5 19c2-.5 3-3 6-3s3 2 8 2"/></svg></div>AirLva</div>
    <h4>Project</h4>
    <button class="btn" id="newp">+ Project baru</button>
    <div class="krow"><button class="btn" id="kcari">Cari kode</button><button class="btn" id="kpub">Publish kode</button></div>
    <button class="btn gbtn2" id="gchat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>Chat Global</button>
    <div id="plist"></div>
    <button class="btn pprof" id="pprof"><span class="av" id="pav"></span><span class="pn" id="pname">Akun</span></button>
  </aside>
  <div class="sheet dlg" id="dlg"></div>
  <div class="sheet psheet" id="psheet"><div class="grab"></div><div class="plist3"><button class="btn pbtn" id="shf" style="--i:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>Kirim foto</button><button class="btn pbtn" id="shp" style="--i:1"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>Bagikan project</button><button class="btn pbtn" id="shc" style="--i:2"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>Bagikan kode</button></div></div>
  <input type="file" id="pfile" accept="image/*" hidden>
  <div id="gate"></div>
  <div class="art-view" id="pview"></div>
  <div class="art-view" id="artv"></div>
  <div class="art-view" id="kview"></div>
  <div class="art-view" id="kdet"></div>
  <div id="popup"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/storage.js?v=20261119a"></script>
<script src="js/cloud.js?v=20261119a"></script>
<script src="js/api.js?v=20261119a"></script>
<script src="js/chat.js?v=20261119a"></script>
<script src="js/artifact.js?v=20261119a"></script>
<script src="js/global.js?v=20261119a"></script>
<script src="js/kode.js?v=20261119a"></script>
<script src="js/popup.js?v=20261119a"></script>
<script src="js/gate.js?v=20261119a"></script>
<script src="js/ui.js?v=20261119a"></script>
<script src="js/main.js?v=20261119a"></script>
</body>
</html>
